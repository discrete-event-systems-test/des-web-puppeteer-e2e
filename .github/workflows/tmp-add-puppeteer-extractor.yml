name: Prepare Puppeteer zip extractor dependency

on:
  push:
    branches:
      - agent/add-puppeteer-zip-extractor
    paths:
      - .github/workflows/tmp-add-puppeteer-extractor.yml

permissions:
  contents: write

concurrency:
  group: prepare-puppeteer-zip-extractor
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DES_FORCE_FIXTURE: '1'
      PUPPETEER_CACHE_DIR: /tmp/des-puppeteer-cache
    steps:
      - name: Check out exact preparation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/add-puppeteer-zip-extractor
          fetch-depth: 0

      - name: Set up Node 22.12
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6.0.0
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Add the exact optional zip extractor peer
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact --ignore-scripts yauzl@3.4.0
          node -e "const p=require('./package.json'); if(p.devDependencies?.yauzl !== '3.4.0') process.exit(1)"
          npm ls yauzl --all

      - name: Prove clean install and real Chromium contracts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules "$PUPPETEER_CACHE_DIR"
          npm ci
          npm run test:puppeteer
          test -f artifacts/des-home.png || test -f test-results/screenshots/des-home.png

      - name: Commit generated package metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'fix(puppeteer): add zip extractor for browser install'
          git push origin HEAD:agent/add-puppeteer-zip-extractor
